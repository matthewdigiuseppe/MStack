## MStack per-paper config.
## Edit at the start of a project; revisit after major decisions.

paper:
  title: ""
  short_name: ""           # for filenames; e.g. "tariffs-aid"
  format: "latex"          # "latex" | "quarto"
  status: "ideating"       # ideating | mapping | designing | building | analyzing | writing | submitted | r-and-r | accepted | archived

authors:
  - name: ""               # your name
    role: "lead"
  # - name: "Coauthor Name"
  #   role: "coauthor"

target_journals:
  # Tier in priority order. /mstack:journal-fit will populate this.
  # - name: "International Organization"
  #   tier: 1
  #   why: ""

design:
  type: ""                 # survey-experiment | field-experiment | did | rd | iv | shift-share | panel-fe | cross-section | qualitative
  prereg: false            # set true once /mstack:preregister is filed
  prereg_url: ""

stats:
  language: "R"            # default; r-coding-skills conventions apply
  primary_spec: ""         # one line describing THE specification

library:
  # /mstack:pdf-ingest converts lit/pdf/*.pdf into lit/md/*.md.
  backend: "auto"          # auto | pymupdf4llm | docling | marker | mineru | pdftotext
  quality_min: 0.70        # escalate to a heavier backend below this score
  split_references: true   # keep reference lists out of the main .md
  crossref: true           # look up metadata by DOI (sends the DOI only)
  crossref_mailto: ""      # your email, to use Crossref's polite pool

decisions:
  # Append a one-liner every time you make a non-obvious call.
  # - "2026-05-09: dropped 2008-2010 from sample due to crisis confound."

voice:
  # Name of a Claude Code skill that defines your prose voice (tone, rhythm,
  # vocabulary). MStack does not ship one — install or author your own and put
  # its skill name here. Leave empty to use a generic academic voice.
  writing_style: ""
  # Name of a reviewer-style skill for /mstack:referee-mock. Leave empty to use
  # MStack's built-in fallback (references/referee-report-conventions.md).
  reviewer_style: ""
